{% extends "base.html" %}
{% block content %}
<div class="article-entry">
<h2>{{ object.title }}</h2>
<p>by {{ object.author }} | {{ object.date }}</p>
<p>{{ object.body }}</p>
</div>
<div>
{% if article.author.pk == request.user.pk %}
<p><a class="btn btn-info ms-2" href="{% url 'article_edit' article.pk %}">Edit</a>
<a class="btn btn-danger ms-2" href="{% url 'article_delete' article.pk %}">Delete</a>
</p>
{% endif %}
<a class="btn btn-primary ms-2" href="{% url 'article_list' %}">View all articles</a>
</div>
{% endblock content %}
