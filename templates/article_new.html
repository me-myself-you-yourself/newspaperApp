{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block content %}
<h1>New article</h1>
<form action="" method="post">{% csrf_token %}
{{ form|crispy }}
<button class="btn btn-success ms-2" type="submit">Save</button>
</form><br>
<a class="btn btn-info ms-2" href="{{ article.get_absolute_url }}">Back</a>
{% endblock content %}
